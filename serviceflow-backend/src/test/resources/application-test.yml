spring:
  datasource:
    url: jdbc:h2:mem:serviceflow_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
    show-sql: false
  flyway:
    enabled: false

server:
  port: 0

serviceflow:
  security:
    jwt:
      secret: TestSecretForJwtTestingPurposesAtLeast256BitsLong1234567890!
      expiration-ms: 86400000
      issuer: serviceflow-backend
    bootstrap-admin:
      enabled: true
      username: admin
      email: admin@serviceflow.com
      password: Admin@123456
      full-name: ผู้ดูแลระบบ
  storage:
    photo-dir: ${java.io.tmpdir}/serviceflow_test_photos
